[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "cypher_graphdb"
authors = [
    { name = "Wolfgang Miller", email = "wolfgang.miller@petrarca-labs.com" },
]
description = "ORM like library and CLI for cypher query language supporting graph databases."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<4.0"
classifiers = [
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.14',
]
dynamic = ["version"]
dependencies = [
    "python-dotenv",
    "antlr4-python3-runtime==4.11.1",
    "pydantic",
    "pydantic-settings>=2.13.1",
    "loguru",
    "psycopg >= 3.3.3",
    "psycopg-binary >= 3.3.3",
    "pymgclient>=1.6",
    "neo4j>=6.4.1",
    "neo4j-rust-ext>=6.4.1",  # the Bolt protocol in Rust: the driver's hot path
    "typing-extensions",
    "tenacity",
    "json-schema-to-pydantic>=0.4.11",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
# Excel import/export. CSV, JSON and YAML need nothing beyond the core.
excel = [
    "openpyxl",
]

# Everything needed by the cypher-graphdb CLI. The core never imports these.
cli = [
    "art",
    "cypher_graphdb[excel]",
    "lark>=1.1",
    "prompt-toolkit",
    "rich",
    "typer",
]

watch = [
    "watchfiles",
]

build = [
    "pip-tools",
    "build",
    "wheel"
]

dev = [
    "cypher_graphdb[cli]",
    "testcontainers",
    "ruff",
    "mypy>=1.18.0",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "setuptools-scm",
]



[tool.uv.sources]


[project.scripts]
cypher-graphdb = "cypher_graphdb.args:typer_main"

[tool.setuptools.package-data]
cypher_graphdb = ["py.typed"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+(?:\\.\\d+)*)"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.ruff]
extend-exclude = ["src/cypher_graphdb/cypher"]
line-length = 130
unsafe-fixes = true

[tool.ruff.lint]
ignore = ["SIM108"]  # Ignore ternary operator suggestions for readability
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # McCabe cyclomatic complexity
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
# Third-party deps without type stubs. We type our own code, not theirs.
ignore_missing_imports = true
# ANTLR-generated parser, same directory ruff already excludes via extend-exclude.
# Not our code; the ANTLR runtime it star-imports from ships no type stubs.
exclude = ["^src/cypher_graphdb/cypher/"]

[tool.pytest.ini_options]
markers = [
    "unit: marks tests as unit tests (default)",
    "integration: marks tests as integration tests (all backends)",
    "integration_memgraph: marks integration tests for Memgraph backend",
    "integration_neo4j: marks integration tests for Neo4j backend",
    "integration_age: marks integration tests for Apache AGE backend",
]
testpaths = ["tests"]
addopts = [
    "-m unit",  # run unit tests by default
    "--strict-markers",
]

[tool.coverage.run]
omit = [
    # omit anything in a .local directory anywhere
    "*/src/cypher_graphdb/cypher/*",
    ]
